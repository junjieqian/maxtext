# GB.RNA 1.6B: encoder-only BERT for RNA with an MLM objective.
# https://huggingface.co/genbio-ai/GB.RNA-1.6B

decoder_block: "gbrna"

# Model Dimensions
base_emb_dim: 2048
base_num_query_heads: 32
base_num_kv_heads: 32
base_mlp_dim: 5440
base_num_decoder_layers: 32
head_dim: 64
vocab_size: 16

# Activations & Normalization
mlp_activations: ["silu", "linear"] # SwiGLU
normalization_layer_epsilon: 1.0e-5

# Q, K, V, O, gate, up, and down projections all have a bias.
attention_bias: true
mlp_bias: true

# Default RoPE: rotate-half on the full head_dim.
rope_max_timescale: 10_000

# The MLM decoder uses the tied word embedding. Do not scale the logits.
logits_via_embedding: true
normalize_embedding_logits: false

enable_dropout: false
