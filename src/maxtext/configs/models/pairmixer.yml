# Model config for genesisml/pairmixer (48-layer Pairmixer trunk)
# Reference: https://huggingface.co/genesisml/pairmixer

decoder_block: "pairmixer"

base_emb_dim: 384          # token_s (sequence representation dimension)
pairmixer_token_z: 128     # token_z (pairwise representation dimension)
base_mlp_dim: 512          # 4 * token_z (pairwise SwiGLU Transition hidden dimension)
base_num_decoder_layers: 48

# Unused attention head placeholders required by base config schema
base_num_query_heads: 16
base_num_kv_heads: 16
head_dim: 24

mlp_activations: ["silu", "linear"]
normalization_layer_epsilon: 1.0e-5
vocab_size: 64             # distogram num_bins / biomolecular token vocabulary
logits_via_embedding: false
enable_dropout: false
